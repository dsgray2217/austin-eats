name: Refresh Discover Cache

on:
  schedule:
    # Every Monday at 08:10 UTC (after Refresh Places Cache)
    - cron: '10 8 * * 1'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/discover-places
        run: |
          curl --fail-with-body -X POST "https://${{ secrets.SITE_DOMAIN }}/api/discover-places" \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}"
